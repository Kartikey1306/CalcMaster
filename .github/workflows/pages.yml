# GitHub Actions is DISABLED for this repository.
#
# All CI and delivery for the portfolio runs in one place:
#   https://github.com/AmericanGroupLLC/agl-manifest
#
# 37 repositories each running their own pipeline meant paying the runner boot,
# the Flutter SDK download and a cold pub cache 37 times over — and the macOS
# half bills at 10x. The manifest does the same work once for the batch.
#
# This file is kept, not deleted, so the pipeline is recoverable: re-enable with
#   gh api -X PUT /repos/AmericanGroupLLC/CalcMaster/actions/permissions -F enabled=true
#
# To validate just this app right now, from agl-manifest:
#   bundle exec fastlane validate apps:CalcMaster

name: Publish marketing site (GitHub Pages)

# Publishes marketing/site/ so the Privacy Policy / Terms / Support URLs are LIVE.
# Both app stores reject submissions without a reachable Privacy Policy URL.
# After the first run, your URLs are:
#   https://<owner>.github.io/<repo>/privacy.html
#   https://<owner>.github.io/<repo>/terms.html
#   https://<owner>.github.io/<repo>/support.html
# Enable once: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main, master]
    paths: ['marketing/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: marketing/site
      - id: deployment
        uses: actions/deploy-pages@v4
