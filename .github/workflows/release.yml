# GitHub Actions is DISABLED for this repository.
#
# All CI and delivery for the portfolio runs in one place:
#   https://github.com/AmericanGroupLLC/agl-manifest
#
# 37 repositories each running their own pipeline meant paying the runner boot,
# the Flutter SDK download and a cold pub cache 37 times over — and the macOS
# half bills at 10x. The manifest does the same work once for the batch.
#
# This file is kept, not deleted, so the pipeline is recoverable: re-enable with
#   gh api -X PUT /repos/AmericanGroupLLC/CalcMaster/actions/permissions -F enabled=true
#
# To validate just this app right now, from agl-manifest:
#   bundle exec fastlane validate apps:CalcMaster

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-14
          - platform: web
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      # agl_i18n, agl_observability and agl_ads are git dependencies on the
      # private AmericanGroupLLC-Backend repository. A runner's built-in token
      # only reaches its own repo, so without this `flutter pub get` fails with
      # "could not read Username for 'https://github.com'".
      - name: Authenticate pub for the private shared packages
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set. Add it as an \
          organization secret with read access to AmericanGroupLLC-Backend — \
          pub cannot fetch the shared packages without it."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:$TOKEN@github.com/".insteadOf \
            "https://github.com/"

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.x', channel: stable, cache: true }

      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - run: flutter pub get

      - name: Build Android
        if: matrix.platform == 'android'
        run: |
          flutter build apk --release --flavor prod --dart-define-from-file=env/prod.json
          flutter build appbundle --release --flavor prod --dart-define-from-file=env/prod.json
          cp build/app/outputs/flutter-apk/app-prod-release.apk CalcMaster-${{ github.ref_name }}-android.apk
          cp build/app/outputs/bundle/prodRelease/app-prod-release.aab CalcMaster-${{ github.ref_name }}-android.aab

      - name: Build iOS
        if: matrix.platform == 'ios'
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos && tar czf ../../../CalcMaster-${{ github.ref_name }}-ios-unsigned.tar.gz Runner.app

      - name: Build Web
        if: matrix.platform == 'web'
        run: |
          flutter build web --release --wasm
          cd build/web && tar czf ../../CalcMaster-${{ github.ref_name }}-web.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: CalcMaster-${{ github.ref_name }}-*

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      # agl_i18n, agl_observability and agl_ads are git dependencies on the
      # private AmericanGroupLLC-Backend repository. A runner's built-in token
      # only reaches its own repo, so without this `flutter pub get` fails with
      # "could not read Username for 'https://github.com'".
      - name: Authenticate pub for the private shared packages
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set. Add it as an \
          organization secret with read access to AmericanGroupLLC-Backend — \
          pub cannot fetch the shared packages without it."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:$TOKEN@github.com/".insteadOf \
            "https://github.com/"

      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          shasum -a 256 CalcMaster-* > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/CalcMaster-*
            artifacts/SHA256SUMS.txt

  build-backend-image:
    runs-on: ubuntu-latest
    steps:
      # agl_i18n, agl_observability and agl_ads are git dependencies on the
      # private AmericanGroupLLC-Backend repository. A runner's built-in token
      # only reaches its own repo, so without this `flutter pub get` fails with
      # "could not read Username for 'https://github.com'".
      - name: Authenticate pub for the private shared packages
        env:
          TOKEN: ${{ secrets.AGL_PACKAGES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AGL_PACKAGES_TOKEN is not set. Add it as an \
          organization secret with read access to AmericanGroupLLC-Backend — \
          pub cannot fetch the shared packages without it."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:$TOKEN@github.com/".insteadOf \
            "https://github.com/"

      - uses: actions/checkout@v4
      - name: Build and tag backend
        working-directory: backend
        run: |
          docker build -t calcmaster-api:${{ github.ref_name }} .
          docker build -t calcmaster-api:latest .
