name: calcmaster
description: "Sheet calculator: lines that work out as you type, with ECB rates on the day."
publish_to: 'none'
version: 4.0.2+5

environment:
  sdk: ^3.5.0

dependencies:
  agl_ads:
    git:
      url: https://github.com/AmericanGroupLLC/agl-manifest.git
      path: packages/agl_ads
      ref: master
  flutter:
    sdk: flutter
  agl_observability:
    git:
      url: https://github.com/AmericanGroupLLC/agl-manifest.git
      path: packages/agl_observability
      ref: master
  # Shared portfolio localization: the locale set, the picker, and the
  # vocabulary every AGL app has in common.
  agl_i18n:
    git:
      url: https://github.com/AmericanGroupLLC/agl-manifest.git
      path: packages/agl_i18n
      ref: master
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  http: ^1.2.2
  intl: any  # pinned by flutter_localizations; see docs/I18N.md
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_svg: ^2.0.16
  url_launcher: ^6.3.1
  # About shows the installed version, read from the platform.
  package_info_plus: ^9.0.1
  # ───── Real monetization SDKs (test creds work without accounts) ─────
  google_mobile_ads: ^5.3.1
  app_tracking_transparency: ^2.0.6+1
  # Share a sheet as text or CSV through the system share sheet.
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  image: ^4.3.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

# Pin archive to the 3.x line: the `image` package's EXR codec references
# `ZLibDecoder`, which archive 4.x removed — without this the icon/splash
# generation tooling fails to compile under the current Dart SDK.
dependency_overrides:
  archive: ^3.6.1

flutter:
  uses-material-design: true
  generate: true
  # google_mobile_ads is CocoaPods-only, but webview_flutter_wkwebview resolves
  # via Swift Package Manager — the two collide during `pod install`. Pin this
  # project to CocoaPods until google_mobile_ads adopts SPM.
  config:
    enable-swift-package-manager: false
  assets:
    - assets/icons/
    - assets/fonts/GolosText-OFL.txt
    - assets/fonts/RedditMono-OFL.txt
  # Golos Text for the interface, Reddit Mono for every figure. Static
  # instances cut from the OFL variable fonts in github.com/google/fonts
  # (ofl/golostext, ofl/redditmono) so each weight renders as drawn.
  fonts:
    - family: GolosText
      fonts:
        - asset: assets/fonts/GolosText-400.ttf
          weight: 400
        - asset: assets/fonts/GolosText-500.ttf
          weight: 500
        - asset: assets/fonts/GolosText-600.ttf
          weight: 600
        - asset: assets/fonts/GolosText-700.ttf
          weight: 700
    - family: RedditMono
      fonts:
        - asset: assets/fonts/RedditMono-400.ttf
          weight: 400
        - asset: assets/fonts/RedditMono-500.ttf
          weight: 500
        - asset: assets/fonts/RedditMono-600.ttf
          weight: 600
        - asset: assets/fonts/RedditMono-700.ttf
          weight: 700

# ──────────────────────────────────────────────
# App icon generation (run: dart run flutter_launcher_icons)
# Source PNGs are produced by tools/gen_icon.dart
# ──────────────────────────────────────────────
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#F4F0E6"
  adaptive_icon_background: "#F4F0E6"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# ──────────────────────────────────────────────
# Splash screen generation (run: dart run flutter_native_splash:create)
# ──────────────────────────────────────────────
flutter_native_splash:
  color: "#F4F0E6"
  color_dark: "#161A17"
  image: "assets/splash/splash_logo.png"
  image_dark: "assets/splash/splash_logo_dark.png"
  android_12:
    color: "#F4F0E6"
    color_dark: "#161A17"
    image: "assets/splash/splash_logo.png"
    image_dark: "assets/splash/splash_logo_dark.png"
  ios: true
  android: true
  fullscreen: false
